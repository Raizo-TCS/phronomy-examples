name: Current Phronomy API examples

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    working-directory: examples

jobs:
  current-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: examples
      - name: Install bundle
        run: bundle install
      - name: Install SQLite bundle
        run: cd 30_sqlite_persistence && bundle install
      - name: Check APIs, run CLI stubs, and validate SQLite persistence
        run: bash scripts/verify_offline.sh

  hosted-workers:
    name: Hosted Worker examples (Ruby ${{ matrix.ruby }}, SQLite)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            ruby: "3.2.3"
          - os: ubuntu-24.04
            ruby: "3.3.6"
          - os: ubuntu-26.04
            ruby: "3.2.11"
          - os: ubuntu-26.04
            ruby: "3.3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/30_sqlite_persistence/Gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: examples/30_sqlite_persistence
      - name: Install SQLite bundle with the published gem
        run: |
          bundle install
          bundle exec ruby -rbundler -rphronomy -e '
            abort "PHRONOMY_PATH must be unset" if ENV.key?("PHRONOMY_PATH")
            spec = Gem.loaded_specs.fetch("phronomy")
            source = Bundler.load.specs.find { |item| item.name == "phronomy" }.source
            abort "Wrong published version" unless spec.version.to_s == "0.32.0"
            abort "Phronomy must come from RubyGems" unless source.is_a?(Bundler::Source::Rubygems)
            puts "Phronomy #{spec.version}"
            puts "Loaded gem: #{spec.full_gem_path}"
            puts "Dependency source: #{source}"
          '
      - name: Exercise Agent and Workflow handoffs with fixed HTTP responses
        run: |
          bundle exec ruby 34_worker_approval/run.rb
          bundle exec ruby 35_workflow_child_approval/run.rb
          bundle exec ruby 36_native_child_approval/run.rb
      - name: Run multi-process regression tests
        run: bash scripts/verify_hosted_regressions.sh
      - name: Verify collection of completed native child owners
        env:
          PHRONOMY_EXAMPLES: ${{ github.workspace }}/examples
          RECORDS: "5"
          MORE_WORK: "1"
        run: bundle exec ruby scripts/verify_terminal_gc.rb preserve

  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ["09_rails_chat", "15_rails_secure_chat", "18_rails_agent_job", "20_cve_scanner"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/${{ matrix.example }}/Gemfile
      RAILS_ENV: test
      PHRONOMY_MODEL: gpt-4o-mini
      PHRONOMY_BASE_URL: https://example.test/v1
      PHRONOMY_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: examples/${{ matrix.example }}
      - name: Install bundle
        run: bundle install
      - name: Migrate and eager load the application
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails db:create db:migrate zeitwerk:check
      - name: Render persisted chat history
        if: matrix.example == '09_rails_chat' || matrix.example == '15_rails_secure_chat'
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails runner ../scripts/verify_chat_history.rb
      - name: Verify CVE notification scopes and scan workflows
        if: matrix.example == '20_cve_scanner'
        run: |
          cd "${{ matrix.example }}"
          bundle exec rspec spec/lib spec/jobs spec/requests
