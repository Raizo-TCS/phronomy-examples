name: Current Phronomy API examples

on: [push, pull_request]

permissions:
  contents: read

env:
  PHRONOMY_PATH: ${{ github.workspace }}/core

defaults:
  run:
    working-directory: examples

jobs:
  current-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - name: Check out the reviewed core candidate
        uses: actions/checkout@v4
        with:
          repository: Raizo-TCS/phronomy
          ref: 8ab59c7d397a1dbd0bd9e295e723cb4ce9406c77
          path: core
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: examples
      - name: Install bundle
        run: bundle install
      - name: Install SQLite bundle
        run: cd 30_sqlite_persistence && bundle install
      - name: Check APIs, run CLI stubs, and validate SQLite persistence
        run: bash scripts/verify_offline.sh

  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ["09_rails_chat", "15_rails_secure_chat", "18_rails_agent_job", "20_cve_scanner"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/${{ matrix.example }}/Gemfile
      RAILS_ENV: test
      PHRONOMY_MODEL: gpt-4o-mini
      PHRONOMY_BASE_URL: https://example.test/v1
      PHRONOMY_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - name: Check out the reviewed core candidate
        uses: actions/checkout@v4
        with:
          repository: Raizo-TCS/phronomy
          ref: 8ab59c7d397a1dbd0bd9e295e723cb4ce9406c77
          path: core
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: examples/${{ matrix.example }}
      - name: Install bundle
        run: bundle install
      - name: Migrate and eager load the application
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails db:create db:migrate zeitwerk:check
      - name: Render persisted chat history
        if: matrix.example == '09_rails_chat' || matrix.example == '15_rails_secure_chat'
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails runner ../scripts/verify_chat_history.rb
