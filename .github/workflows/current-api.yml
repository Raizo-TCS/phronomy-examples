name: Current Phronomy API examples

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    working-directory: examples

jobs:
  current-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: examples
      - name: Install bundle
        run: bundle install
      - name: Install SQLite bundle
        run: cd 30_sqlite_persistence && bundle install
      - name: Check APIs, run CLI stubs, and validate SQLite persistence
        run: bash scripts/verify_offline.sh

  hosted-workers:
    name: Hosted Worker examples (Ruby 3.3, SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHRONOMY_PATH: ${{ github.workspace }}/phronomy
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/30_sqlite_persistence/Gemfile
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Raizo-TCS/phronomy
          # These examples exercise unreleased APIs. Pin the reviewed core commit.
          ref: 8bb078bc7fcaa08db82b222dad2a474c486452b5
          path: phronomy
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: examples/30_sqlite_persistence
      - name: Install SQLite bundle with the paired core
        run: |
          bundle install
          bundle exec ruby -rphronomy -e 'abort "Wrong core checkout" unless File.realpath(Gem.loaded_specs.fetch("phronomy").full_gem_path) == File.realpath(ENV.fetch("PHRONOMY_PATH"))'
      - name: Exercise Agent and Workflow handoffs with fixed HTTP responses
        run: |
          bundle exec ruby 34_worker_approval/run.rb
          bundle exec ruby 35_workflow_child_approval/run.rb

  rails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ["09_rails_chat", "15_rails_secure_chat", "18_rails_agent_job", "20_cve_scanner"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/examples/${{ matrix.example }}/Gemfile
      RAILS_ENV: test
      PHRONOMY_MODEL: gpt-4o-mini
      PHRONOMY_BASE_URL: https://example.test/v1
      PHRONOMY_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: examples/${{ matrix.example }}
      - name: Install bundle
        run: bundle install
      - name: Migrate and eager load the application
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails db:create db:migrate zeitwerk:check
      - name: Render persisted chat history
        if: matrix.example == '09_rails_chat' || matrix.example == '15_rails_secure_chat'
        run: |
          cd "${{ matrix.example }}"
          bundle exec rails runner ../scripts/verify_chat_history.rb
      - name: Verify CVE notification scopes and scan workflows
        if: matrix.example == '20_cve_scanner'
        run: |
          cd "${{ matrix.example }}"
          bundle exec rspec spec/lib spec/jobs spec/requests
