name: SQLite Persistence Reference Backend

on:
  push:
    paths:
      - "30_sqlite_persistence/**"
      - "09_rails_chat/db/**"
      - "17_multi_agent_handoff/**"
      - "21_team_coordinator/**"
      - "spec/**"
      - "shared/llm_config.rb"
      - "Gemfile.phronomy"
      - "shared/persistence_coordination_contract.rb"
      - ".github/workflows/sqlite-persistence.yml"
  pull_request:
    paths:
      - "30_sqlite_persistence/**"
      - "09_rails_chat/db/**"
      - "17_multi_agent_handoff/**"
      - "21_team_coordinator/**"
      - "spec/**"
      - "shared/llm_config.rb"
      - "Gemfile.phronomy"
      - "shared/persistence_coordination_contract.rb"
      - ".github/workflows/sqlite-persistence.yml"

# Temporary coordinated branch dependency for the Storage SPI migration.
env:
  PHRONOMY_PATH: ${{ github.workspace }}/vendor/phronomy

jobs:
  sqlite-persistence:
    name: Ruby ${{ matrix.ruby }} / SQLite Persistence
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"

    defaults:
      run:
        working-directory: 30_sqlite_persistence

    steps:
      - uses: actions/checkout@v4
      - name: Check out the matching core refactoring branch
        uses: actions/checkout@v4
        with:
          repository: Raizo-TCS/phronomy
          ref: refactor/architecture
          path: vendor/phronomy

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install bundle
        run: bundle install

      - name: Run authoritative contract and SQLite integration specs
        run: bundle exec rspec

      - name: Run durable reload demonstration
        run: bundle exec ruby run.rb
