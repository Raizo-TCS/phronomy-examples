name: SQLite Persistence Reference Backend

on:
  push:
    paths:
      - "30_sqlite_persistence/**"
      - "09_rails_chat/db/**"
      - "17_multi_agent_handoff/**"
      - "21_team_coordinator/**"
      - "spec/**"
      - "shared/llm_config.rb"
      - "shared/output_validator.rb"
      - "Gemfile.phronomy"
      - "Gemfile.phronomy_active_record"
      - "packages/phronomy-active_record/**"
      - "shared/storage/**"
      - "shared/storage_resource_contract.rb"
      - "shared/reason_diagnostics_contract.rb"
      - "shared/persistence_storage_mapping.rb"
      - "shared/persistence_coordination_contract.rb"
      - "shared/reserved_child_admission_contract.rb"
      - ".github/workflows/sqlite-persistence.yml"
  pull_request:
    paths:
      - "30_sqlite_persistence/**"
      - "09_rails_chat/db/**"
      - "17_multi_agent_handoff/**"
      - "21_team_coordinator/**"
      - "spec/**"
      - "shared/llm_config.rb"
      - "shared/output_validator.rb"
      - "Gemfile.phronomy"
      - "Gemfile.phronomy_active_record"
      - "packages/phronomy-active_record/**"
      - "shared/storage/**"
      - "shared/storage_resource_contract.rb"
      - "shared/reason_diagnostics_contract.rb"
      - "shared/persistence_storage_mapping.rb"
      - "shared/persistence_coordination_contract.rb"
      - "shared/reserved_child_admission_contract.rb"
      - ".github/workflows/sqlite-persistence.yml"

permissions:
  contents: read

env:
  PHRONOMY_PATH: ${{ github.workspace }}/core

jobs:
  sqlite-persistence:
    name: Ruby ${{ matrix.ruby }} / SQLite Persistence
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"

    defaults:
      run:
        working-directory: examples/30_sqlite_persistence

    steps:
      - uses: actions/checkout@v4
        with:
          path: examples
          persist-credentials: false

      - name: Check out the reviewed core candidate
        uses: actions/checkout@v4
        with:
          repository: Raizo-TCS/phronomy
          ref: 8ab59c7d397a1dbd0bd9e295e723cb4ce9406c77
          path: core
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          working-directory: examples/30_sqlite_persistence

      - name: Install bundle
        run: bundle install

      - name: Run authoritative contract and SQLite integration specs
        run: bundle exec rspec

      - name: Run durable reload demonstration
        run: bundle exec ruby run.rb
